<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-label="কৃষকের প্রতিকৃতি, হাতে তাজা সবজি">
  <defs>
    <linearGradient id="warmbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <rect width="760" height="900" fill="url(#warmbg)"/>

  <!-- backdrop circle -->
  <circle cx="380" cy="430" r="330" fill="#ffffff" opacity="0.55"/>
  <circle cx="380" cy="430" r="270" fill="#dcfce7"/>

  <!-- shoulders -->
  <path d="M180 900 q30 -260 200 -260 q170 0 200 260 Z" fill="#166534"/>

  <!-- neck -->
  <rect x="330" y="500" width="100" height="80" rx="30" fill="#c9732f"/>

  <!-- head -->
  <circle cx="380" cy="430" r="120" fill="#c9732f"/>
  <!-- hair -->
  <path d="M260 410 q120 -140 240 0 q10 30 -30 20 l-20 -40 q-70 -50 -140 0 l-20 40 q-40 10 -30 -20 Z" fill="#1e293b"/>

  <!-- face -->
  <circle cx="410" cy="400" r="5" fill="#1e293b"/>
  <circle cx="350" cy="400" r="5" fill="#1e293b"/>
  <path d="M330 445 q50 45 100 0" stroke="#7c2d12" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- glasses -->
  <circle cx="410" cy="400" r="26" fill="none" stroke="#334155" stroke-width="6"/>
  <circle cx="350" cy="400" r="26" fill="none" stroke="#334155" stroke-width="6"/>
  <path d="M376 400 h-30 M410 400 h30" stroke="#334155" stroke-width="6"/>
  <!-- smile -->
  <path d="M345 465 q35 22 70 0" stroke="#7c2d12" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- produce in hand -->
  <g transform="translate(150 640)">
    <path d="M10 90 q70 -40 150 -10 l-10 60 q-70 10 -130 -15 Z" fill="#b45309"/>
    <circle cx="70" cy="40" r="26" fill="#22c55e"/>
    <circle cx="120" cy="34" r="24" fill="#f59e0b"/>
    <circle cx="95" cy="18" r="20" fill="#ef4444"/>
    <path d="M70 14 q45 -40 100 -10" stroke="#15803d" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>