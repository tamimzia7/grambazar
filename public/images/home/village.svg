<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="গ্রামের দৃশ্য: পুকুর, গাছ আর সন্ধ্যার আলো">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="0.6" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky3)"/>
  <circle cx="600" cy="210" r="90" fill="#fde68a" opacity="0.95"/>

  <!-- trees -->
  <g>
    <circle cx="180" cy="340" r="70" fill="#15803d"/>
    <circle cx="250" cy="360" r="48" fill="#16a34a"/>
    <circle cx="930" cy="330" r="80" fill="#166534"/>
    <circle cx="1020" cy="355" r="55" fill="#15803d"/>
    <rect x="172" y="390" width="16" height="90" fill="#92400e"/>
    <rect x="930" y="390" width="18" height="100" fill="#92400e"/>
  </g>

  <!-- houses -->
  <g>
    <rect x="360" y="360" width="150" height="100" fill="#fff7ed"/>
    <polygon points="345,365 435,290 525,365" fill="#b45309"/>
    <rect x="400" y="400" width="30" height="60" fill="#7c2d12"/>
    <rect x="760" y="380" width="130" height="85" fill="#fff7ed"/>
    <polygon points="748,385 825,320 902,385" fill="#92400e"/>
  </g>

  <!-- pond -->
  <ellipse cx="600" cy="520" rx="430" ry="130" fill="url(#pond)"/>
  <ellipse cx="600" cy="518" rx="400" ry="110" fill="#7dd3fc" opacity="0.4"/>
  <path d="M620 520 q30 -40 80 -30" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- boat -->
  <path d="M420 505 q100 -40 190 0 l-24 26 q-72 -18 -142 0 Z" fill="#92400e"/>
  <path d="M520 480 l20 30" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- cow by the bank -->
  <g transform="translate(930 500)">
    <rect x="0" y="20" width="90" height="46" rx="16" fill="#f5f5f4"/>
    <circle cx="95" cy="36" r="26" fill="#e7e5e4"/>
    <circle cx="100" cy="30" r="7" fill="#a1a1aa"/>
    <rect x="14" y="6" width="16" height="14" rx="4" fill="#a1a1aa"/>
    <rect x="24" y="66" width="12" height="34" rx="6" fill="#a1a1aa"/>
    <rect x="62" y="66" width="12" height="34" rx="6" fill="#a1a1aa"/>
  </g>

  <!-- birds -->
  <path d="M300 160 q15 -14 30 0 M380 130 q15 -14 30 0" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>