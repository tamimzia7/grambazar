<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="বাংলাদেশের গ্রামের দেখা: ধানের খেত, গাছ আর তাজা পণ্যের ঝুড়ি">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.55" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="980" cy="150" r="70" fill="#fbbf24" opacity="0.9"/>
  <circle cx="980" cy="150" r="100" fill="#fbbf24" opacity="0.25"/>

  <!-- distant fields -->
  <path d="M0 560 Q300 470 620 540 T1200 470 L1200 620 L0 620 Z" fill="#a3e635"/>
  <path d="M0 610 Q320 520 660 590 T1200 530 L1200 700 L0 700 Z" fill="#84cc16"/>

  <!-- village house -->
  <g transform="translate(180 330)">
    <rect x="20" y="70" width="150" height="110" fill="#fff7ed"/>
    <polygon points="5,75 95,5 185,75" fill="#b45309"/>
    <polygon points="95,5 95,35 105,35 105,5" fill="#92400e"/>
    <rect x="55" y="110" width="34" height="70" fill="#7c2d12"/>
    <rect x="115" y="100" width="36" height="36" fill="#fde047"/>
  </g>

  <!-- trees -->
  <g fill="#166534">
    <circle cx="430" cy="430" r="52"/>
    <circle cx="490" cy="445" r="44"/>
    <circle cx="900" cy="420" r="60"/>
    <circle cx="968" cy="435" r="48"/>
  </g>
  <rect x="424" y="455" width="12" height="70" fill="#92400e"/>
  <rect x="896" y="452" width="12" height="80" fill="#92400e"/>

  <!-- rice rows foreground -->
  <g stroke="#15803d" stroke-width="10" stroke-linecap="round" opacity="0.5">
    <path d="M40 700 q18 -60 -4 -110"/>
    <path d="M120 700 q18 -60 -4 -110"/>
    <path d="M200 700 q18 -60 -4 -110"/>
    <path d="M1030 700 q18 -60 -4 -110"/>
    <path d="M1110 700 q18 -60 -4 -110"/>
  </g>

  <!-- large produce basket -->
  <g transform="translate(620 470)">
    <path d="M10 160 q60 -60 270 -30 l40 180 a190 60 0 1 1 -340 -30 Z" fill="#b45309"/>
    <path d="M20 170 q60 -55 260 -28 l34 170 a180 55 0 1 1 -330 -28 Z" fill="#d97706"/>
    <ellipse cx="180" cy="120" rx="150" ry="52" fill="#ca8a04"/>
    <!-- rice -->
    <ellipse cx="190" cy="110" rx="120" ry="42" fill="#fef3c7"/>
    <path d="M70 110 q80 -55 300 -20" stroke="#fde68a" stroke-width="26" fill="none" stroke-linecap="round"/>
    <!-- vegetables -->
    <circle cx="120" cy="80" r="34" fill="#16a34a"/>
    <circle cx="245" cy="70" r="28" fill="#ef4444"/>
    <circle cx="170" cy="52" r="24" fill="#f59e0b"/>
    <circle cx="300" cy="95" r="20" fill="#84cc16"/>
    <path d="M120 46 q40 -40 90 -20" stroke="#15803d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M245 44 q30 -30 60 -16" stroke="#166534" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- fish -->
    <ellipse cx="310" cy="135" rx="46" ry="16" fill="#38bdf8"/>
    <polygon points="356,135 380,120 380,150" fill="#0ea5e9"/>
    <circle cx="278" cy="135" r="3" fill="#0c4a6e"/>
  </g>

  <!-- floating leaf accents -->
  <g fill="#16a34a" opacity="0.9">
    <path d="M520 250 q40 -30 80 0 q-40 30 -80 0 Z"/>
    <path d="M1160 700 q40 -30 80 0 q-40 30 -80 0 Z" opacity="0.6"/>
  </g>
</svg>